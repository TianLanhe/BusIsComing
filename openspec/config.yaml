schema: spec-driven

context: |
  BusIsComing 是面向香港巴士通勤場景的 Android App。核心閉環是保存或臨時選擇起終點、比較 Citybus 點到點路線與首程 ETA，並可在出門前啟動短時通知欄監控。頂層 destination 為常用、搜尋和設定。

  專案使用 Kotlin、XML、AppCompat、Material Components 及輕量 Repository 分層。UI 負責展示、輸入和生命週期協調；data 層負責本機資料、網絡、解析、cache 與查詢編排；service 層負責前台監控、通知、調度和 TTS。耗時工作不得阻塞主線程，並發工作須處理取消、generation、過期 callback、部分失敗及生命週期。

  生產資料來自 Citybus mobile、DATA.GOV.HK Citybus ETA、Google Geocoding 及更新功能所需的 Google Play／官方網站；fixture 和 fake 只用於測試。外部格式假設應集中在 parser／repository 或對應 source，並保留可復現證據及回歸測試。

  「行程」是使用者保存的起終點配置；「路線」是查詢返回的乘車方案；「乘車段」是一條路線中的單段巴士服務。內部 RouteConfig、route_configs、resource key 及 .bicroutes 是兼容名稱，不決定 runtime 術語。

  文件、OpenSpec 人類可讀內容、程式註解及中文測試名稱使用繁體中文。App runtime 自有文字必須同時提供香港繁體、獨立簡體及自然英文；使用者資料和第三方原文不自動翻譯。

  目前事實應由相關代碼、資源、Manifest、構建配置和測試確認；對外契約由生效 specs 表達；架構和長期原理見 docs；倉庫工作規則見 AGENTS.md。發現衝突時須明確裁決，不得靜默選擇或複製過期描述。

rules:
  proposal:
    - '使用繁體中文撰寫；代碼符號、能力 ID、外部接口名稱及 OpenSpec 固定標題保持原樣。'
    - '完整保留 Why、What Changes、Capabilities、Impact；說明目前問題、改動理由、可觀察結果、範圍與非目標，不以底層實作取代需求。'
    - '在 Capabilities 中區分 New 與 Modified；能力 ID 使用 kebab-case，並與 specs/<capability>/spec.md 一致。'
    - 'Impact 指出受影響模組、既有 specs、資料／相容性、外部來源、測試及人工驗證。'
    - '涉及外部服務、UI、通知、背景工作、本機資料或權限時，列出接口假設、生命週期、失敗／恢復、使用者可控性及驗證風險。'
    - '需求有多種合理解釋時先澄清；使用者要求新 change 時不得默默併入既有 change。'

  specs:
    - '人類可讀內容使用繁體中文；保留 ADDED／MODIFIED／REMOVED Requirements、Requirement、Scenario 等解析標記。'
    - '每個 requirement 表達單一可驗收能力，以 SHALL／SHALL NOT 規定行為，並至少包含一個 WHEN／THEN scenario。'
    - 'Modified requirement 提供修改後完整內容；Removed requirement 說明理由及遷移影響。'
    - '描述外部可觀察行為與契約，不把私有類名、函式或臨時實作步驟當需求。'
    - '按本 change 覆蓋正常、空、部分、失敗、重試／取消、並發／過期結果及生命週期邊界。'
    - '涉及資料、權限、通知、背景服務、UI 或外部 API 時，規定資料保護、停止／恢復、可見狀態、無障礙及上游回應與展示邊界。'
    - '審核 scenario 是否可由自動化或明確人工步驟驗證，且不與其他生效 spec 衝突。'

  design:
    - '使用繁體中文撰寫；保持 Context、Goals / Non-Goals、Decisions、Risks / Trade-offs，按需要增加 Migration Plan 或 Open Questions。'
    - '基於實際代碼、接口及資料流描述現況，不假設不存在的模組、框架或後端。'
    - '核心決策說明選擇、原因、邊界及被否決方案；不只列最終實作。'
    - '維持 UI、data／repository、model／service 邊界；描述與變更相關的線程、取消、generation、生命週期、失敗、cache、持久化及相容性。'
    - '外部接口變更記錄 URL／參數／header／格式假設、身份對齊及可復現證據；UI 變更引用現行 UI／本地化文件。'
    - '測試策略對應 specs scenarios，區分純邏輯、parser／fixture、instrumentation、模擬器／實機及真實外部服務。'

  tasks:
    - '使用繁體中文及分組編號的 checkbox；完成後如實更新勾選，不保留與實際狀態不符的項目。'
    - '按依賴拆成可獨立實作與驗證的步驟，寫明產出、主要檔案／模組及完成條件。'
    - '每個 requirement／scenario 可追溯到實作、測試或人工驗證；不得只列代碼而省略驗收。'
    - '外部 API／parser 改動加入可復現請求、fixture 或回歸；UI／通知／背景改動加入符合目標設備畫像的裝置驗證。'
    - '最終 Android 實作原則上包含 ./gradlew build；無法執行時記錄原因及風險。'
    - '不得夾帶 proposal／design 未授權的重構；必要擴張先更新 artifacts。'
    - '/opsx-apply 按 tasks 執行並同步勾選，完成後核對工作區、驗證及提交範圍，再依 AGENTS.md 提交規則處理。'
